<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px 16px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2328;
        background: #ffffff;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        cursor: pointer;
      }
      input {
        margin-top: 2px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e6edf3;
          background: #0d1117;
        }
      }
    </style>
  </head>
  <body>
    <h1>Gentle Request Changes</h1>
    <label>
      <input type="checkbox" id="hide-comment-option" />
      <span>Hide the “Comment” option when submitting a review</span>
    </label>
    <script src="popup.js"></script>
  </body>
</html>
